[workspace]
resolver = "2"
members = ["crates/openslicer-core", "crates/openslicer-io", "crates/openslicer-geom", "crates/openslicer-split", "crates/openslicer-joints", "crates/openslicer-fab", "crates/openslicer-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CS92604/OpenSlicer"
rust-version = "1.85"

[workspace.dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
openslicer-core = { path = "crates/openslicer-core" }
openslicer-io = { path = "crates/openslicer-io" }
openslicer-geom = { path = "crates/openslicer-geom" }
openslicer-split = { path = "crates/openslicer-split" }
openslicer-joints = { path = "crates/openslicer-joints" }
openslicer-fab = { path = "crates/openslicer-fab" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustc-hash = "2"
earcutr = "0.5"
spade = "2"
boolmesh = { version = "0.2.1", features = ["rayon"] }
i_overlay = "9"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
