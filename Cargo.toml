[workspace]
resolver = "2"
members = ["crates/openslicer-core", "crates/openslicer-io", "crates/openslicer-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CS92604/OpenSlicer"
rust-version = "1.85"

[workspace.dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
openslicer-core = { path = "crates/openslicer-core" }
openslicer-io = { path = "crates/openslicer-io" }

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
