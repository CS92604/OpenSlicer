[package]
name = "openslicer-app"
description = "OpenSlicer desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openslicer"
path = "src/main.rs"

[dependencies]
openslicer-core.workspace = true
openslicer-io.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
egui_glow = "0.36"
rfd = "0.17"

[dev-dependencies]
ron = "0.12"
