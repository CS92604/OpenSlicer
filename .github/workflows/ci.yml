name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release --locked -p openslicer-app -p openslicer-cli
      - uses: actions/upload-artifact@v4
        with:
          name: openslicer-${{ matrix.os }}
          path: |
            target/release/openslicer
            target/release/openslicer.exe
            target/release/openslicer-cli
            target/release/openslicer-cli.exe
          if-no-files-found: ignore
