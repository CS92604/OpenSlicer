name: Release

# Publishes ONE file: openslicer.exe (no installer, no archive).
# Trigger by pushing a tag such as v0.2.0, or run it manually.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (blank = build only, no release)
        default: v0.2.0
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build (statically linked, single file)
        run: cargo build --release --locked -p openslicer-app
      - name: Name the file
        shell: pwsh
        run: |
          Copy-Item target/release/openslicer.exe openslicer.exe
          Get-FileHash openslicer.exe -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: openslicer.exe
          path: openslicer.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: openslicer.exe
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            Download `openslicer.exe` and run it. One file, no installer.

            See the README for what it does, its known limits and what has not been verified yet.
